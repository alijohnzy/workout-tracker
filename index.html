<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1622">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="4-Day Plan">
<meta name="application-name" content="4-Day Plan">
<!-- iOS ignores the manifest icons for Add to Home Screen and reads this instead.
     Without it the home screen shows a screenshot of the page. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F1622'/%3E%3Crect x='12' y='27' width='40' height='10' rx='3' fill='%233B6FE0'/%3E%3Crect x='6' y='20' width='9' height='24' rx='3' fill='%23E0B048'/%3E%3Crect x='49' y='20' width='9' height='24' rx='3' fill='%23E0B048'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<title>4-Day Plan</title>

<style>
  :root{
    --ink:#0F1622; --surface:#1A2436; --surface-hi:#22304A; --line:#2C3A50;
    --blue:#3B6FE0; --gold:#E0B048; --green:#3FBF7F; --red:#E0605A;
    --text:#E8EDF5; --muted:#8595AC; --pad:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--text);}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom);overscroll-behavior:none;
  }
  button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;}
  input{font-family:inherit;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .wrap{max-width:520px;margin:0 auto;padding:var(--pad);}
  .hidden{display:none !important;}

  .eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
  .display{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;text-transform:uppercase;margin:2px 0 0;}

  /* ---------- home ---------- */
  .home-head{padding:24px 0 20px;border-bottom:1px solid var(--line);margin-bottom:20px;}
  .home-head .display{font-size:34px;}
  .home-sub{color:var(--muted);font-size:14px;margin-top:8px;}
  .streak{font-size:13px;color:var(--gold);font-weight:700;margin-top:10px;}

  .resume-wrap{margin-bottom:20px;}
  .resume{display:block;width:100%;text-align:left;background:var(--blue);border-radius:12px;padding:16px;}
  .resume-drop{display:block;width:100%;padding:10px;margin-top:6px;font-size:13px;font-weight:700;
               color:var(--muted);text-align:center;}
  .resume-drop:active{color:var(--red);}
  .day.up{border-color:var(--blue);}
  .up-next{display:inline-block;margin-bottom:6px;font-size:10px;font-weight:800;letter-spacing:.12em;
           text-transform:uppercase;color:var(--blue);}
  .resume .eyebrow{color:rgba(255,255,255,.75);}
  .resume-name{font-size:20px;font-weight:800;text-transform:uppercase;margin-top:2px;}
  .resume-meta{font-size:13px;color:rgba(255,255,255,.8);margin-top:2px;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 14px;
       text-align:left;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;}
  .day:active{background:var(--surface-hi);}
  .day-name{font-size:22px;font-weight:800;text-transform:uppercase;line-height:1.05;}
  .day-meta{font-size:12px;color:var(--muted);margin-top:6px;}
  .day-bar{height:3px;border-radius:2px;background:var(--line);margin-top:12px;overflow:hidden;}
  .day-bar i{display:block;height:100%;background:var(--gold);width:0;}

  .note{margin-top:22px;padding:14px;border-radius:10px;background:var(--surface);
        border:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.5;}
  .note b{color:var(--text);font-weight:700;}

  .ghost{display:block;width:100%;margin-top:12px;padding:14px;font-size:14px;font-weight:700;
         color:var(--muted);border:1px solid var(--line);border-radius:10px;text-align:center;}

  /* ---------- session chrome ---------- */
  .topbar{position:sticky;top:0;z-index:5;background:var(--ink);padding:12px var(--pad) 0;
          border-bottom:1px solid var(--line);max-width:520px;margin:0 auto;}
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .back{font-size:14px;font-weight:700;color:var(--muted);padding:6px 8px 6px 0;}
  .counter{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;}
  .steps{display:flex;gap:4px;padding:12px 0;}
  .steps i{flex:1;height:4px;border-radius:2px;background:var(--line);}
  .steps i.done{background:var(--gold);}
  .steps i.now{background:var(--blue);}

  .ex-name{font-size:28px;font-weight:800;text-transform:uppercase;letter-spacing:-.02em;line-height:1.08;margin:20px 0 0;}
  .ex-alt{font-size:13px;color:var(--muted);margin-top:8px;}
  .ex-alt b{color:var(--gold);font-weight:700;}

  .target{display:flex;gap:10px;margin-top:16px;}
  .chip{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .chip .eyebrow{font-size:10px;}
  .chip-val{font-size:18px;font-weight:800;margin-top:2px;}

  /* last time */
  .last{margin-top:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);
        border-left:3px solid var(--gold);border-radius:8px;font-size:13px;}
  .last .eyebrow{font-size:10px;margin-bottom:4px;}
  .last-sets{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;}
  .last-none{color:var(--muted);font-size:13px;margin-top:12px;}

  /* video links */
  .vids{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .vid{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;
       text-decoration:none;background:var(--surface);border:1px solid var(--line);
       color:var(--muted);font-size:13px;font-weight:700;}
  .vid .play{font-size:10px;}
  .vid.vetted{border-color:var(--gold);color:var(--gold);}
  .vid .tag{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
            background:var(--line);color:var(--muted);padding:2px 6px;border-radius:4px;}

  /* set buttons */
  .sets{display:flex;gap:8px;margin-top:20px;}
  .set{flex:1;background:var(--surface);border:2px solid var(--line);border-radius:14px;
       padding:14px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:82px;}
  .set .n{font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
  .set .l{font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--muted);margin-top:5px;text-transform:uppercase;}
  .set.done{background:var(--blue);border-color:var(--blue);}
  .set.done .n{font-size:17px;}
  .set.done .l{color:rgba(255,255,255,.85);}
  .set.active{border-color:var(--gold);}
  .set:active{transform:scale(.97);}

  /* logging sheet */
  .sheet{margin-top:14px;background:var(--surface);border:1px solid var(--gold);border-radius:14px;padding:16px;}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .sheet-title{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);}
  .sheet-close{font-size:13px;color:var(--muted);font-weight:700;}
  .fields{display:flex;gap:10px;}
  .field{flex:1;}
  .field .eyebrow{font-size:10px;margin-bottom:6px;display:block;text-align:center;}
  .stepper{display:flex;align-items:center;background:var(--ink);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .stepper button{width:44px;height:52px;font-size:22px;font-weight:800;color:var(--muted);flex-shrink:0;}
  .stepper button:active{background:var(--surface-hi);color:var(--text);}
  .stepper input{flex:1;width:100%;min-width:0;background:none;border:none;text-align:center;
                 font-size:22px;font-weight:800;color:var(--text);padding:0;
                 font-variant-numeric:tabular-nums;-moz-appearance:textfield;}
  .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .log-btn{display:block;width:100%;margin-top:14px;padding:16px;border-radius:10px;background:var(--blue);
           color:#fff;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;}
  .prefill{text-align:center;font-size:12px;color:var(--muted);margin-top:10px;}

  .hint{font-size:13px;color:var(--muted);text-align:center;margin-top:12px;}

  details.form{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  details.form summary{list-style:none;padding:14px 16px;font-size:13px;font-weight:800;letter-spacing:.1em;
                       text-transform:uppercase;color:var(--gold);display:flex;justify-content:space-between;align-items:center;}
  details.form summary::-webkit-details-marker{display:none;}
  details.form summary::after{content:"+";font-size:18px;color:var(--muted);}
  details.form[open] summary::after{content:"–";}
  .form-body{padding:0 16px 16px;font-size:14px;line-height:1.55;}
  .check{display:flex;gap:10px;margin-bottom:12px;}
  .check .mark{font-weight:800;flex-shrink:0;}
  .check.ok .mark{color:var(--green);}
  .check.no .mark{color:var(--red);}
  .cue{margin-top:4px;padding:12px;background:var(--ink);border-radius:8px;border-left:3px solid var(--gold);font-size:14px;}
  .cue b{color:var(--gold);}
  .warn{margin-top:12px;padding:12px;background:rgba(224,96,90,.1);border:1px solid rgba(224,96,90,.35);
        border-radius:8px;font-size:13px;color:#F0A9A5;}
  .wu{margin:0;padding-left:18px;}
  .wu li{margin-bottom:8px;font-size:15px;}

  .nav{display:flex;gap:10px;margin:24px 0 32px;}
  .nav button{padding:16px;border-radius:12px;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;}
  .prev{flex:0 0 84px;background:var(--surface);border:1px solid var(--line);color:var(--muted);}
  .next{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--text);}
  .next.ready{background:var(--blue);border-color:var(--blue);color:#fff;}

  /* rest overlay */
  .rest{position:fixed;inset:0;z-index:50;background:var(--ink);display:flex;flex-direction:column;
        align-items:center;justify-content:center;padding:24px;text-align:center;}
  .rest-label{font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);}
  .rest-time{font-size:104px;font-weight:800;line-height:1;letter-spacing:-.04em;
             font-variant-numeric:tabular-nums;margin:10px 0 6px;}
  .rest-time.over{color:var(--green);}
  .rest-logged{font-size:15px;color:var(--gold);font-weight:700;margin-bottom:8px;}
  .rest-next{font-size:15px;color:var(--muted);max-width:280px;}
  .rest-btns{display:flex;gap:12px;margin-top:40px;width:100%;max-width:320px;}
  .rest-btns button{flex:1;padding:16px;border-radius:12px;font-size:14px;font-weight:800;
                    text-transform:uppercase;letter-spacing:.06em;}
  .add{background:var(--surface);border:1px solid var(--line);}
  .skip{background:var(--blue);color:#fff;}

  /* finish + history */
  .done-screen{text-align:center;padding:44px 0 20px;}
  .done-mark{font-size:56px;line-height:1;}
  .done-screen .display{font-size:30px;margin-top:14px;}
  .done-sub{color:var(--muted);font-size:15px;margin-top:8px;}
  .summary{margin-top:26px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .srow{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;}
  .srow:last-child{border-bottom:none;}
  .srow .nm{font-weight:700;}
  .srow .vv{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;flex-shrink:0;}
  .save-btn{display:block;width:100%;margin-top:20px;padding:18px;border-radius:12px;background:var(--gold);
            color:#12181f;font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;}

  .hist-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;}
  .hist-card summary{list-style:none;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .hist-card summary::-webkit-details-marker{display:none;}
  .hist-name{font-size:16px;font-weight:800;text-transform:uppercase;}
  .hist-date{font-size:12px;color:var(--muted);margin-top:2px;}
  .hist-vol{font-size:12px;color:var(--gold);font-weight:700;text-align:right;flex-shrink:0;}
  .empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:15px;line-height:1.6;}

  /* ---------- calendar ---------- */
  .tabs{display:flex;gap:8px;margin-bottom:18px;}
  .tab{flex:1;padding:11px;border-radius:9px;background:var(--surface);border:1px solid var(--line);
       color:var(--muted);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;}
  .tab.on{background:var(--surface-hi);border-color:var(--blue);color:var(--text);}

  .mo{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .mo-name{font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;}
  .mo-nav{display:flex;gap:6px;}
  .mo-nav button{width:40px;height:40px;border-radius:9px;background:var(--surface);
                 border:1px solid var(--line);font-size:17px;font-weight:800;color:var(--muted);}
  .mo-nav button:disabled{opacity:.3;}

  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px;}
  .dow span{text-align:center;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--muted);}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cell{aspect-ratio:1/1;border-radius:9px;display:flex;align-items:center;justify-content:center;
        font-size:14px;font-weight:700;color:var(--muted);background:transparent;
        font-variant-numeric:tabular-nums;position:relative;}
  .cell.pad{visibility:hidden;}
  .cell.today{box-shadow:inset 0 0 0 1px var(--muted);}
  .cell.hit{color:#fff;font-weight:800;}
  .cell.upper{background:var(--blue);}
  .cell.lower{background:var(--gold);color:#12181f;}
  .cell.both{background:linear-gradient(135deg,var(--blue) 50%,var(--gold) 50%);color:#fff;}
  .cell.sel{box-shadow:0 0 0 2px var(--text);}

  .legend{display:flex;gap:16px;justify-content:center;margin-top:16px;font-size:12px;color:var(--muted);}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;}
  .stat{margin-top:16px;padding:14px;background:var(--surface);border:1px solid var(--line);
        border-radius:10px;font-size:13px;color:var(--muted);text-align:center;}
  .stat b{color:var(--gold);font-weight:800;}

  .daycard{margin-top:16px;background:var(--surface);border:1px solid var(--gold);border-radius:12px;overflow:hidden;}
  .daycard h4{margin:0;padding:13px 15px;font-size:14px;font-weight:800;text-transform:uppercase;
              letter-spacing:.06em;color:var(--gold);border-bottom:1px solid var(--line);}

  .ics{display:block;width:100%;margin-top:14px;padding:15px;border-radius:10px;
       background:var(--surface);border:1px solid var(--gold);color:var(--gold);
       font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;text-align:center;}
  .ics-note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.5;}

  .data{margin-top:22px;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .data-head{padding:14px;background:var(--surface-hi);font-size:11px;font-weight:800;
             letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
             list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;}
  .data-head::-webkit-details-marker{display:none;}
  .data-head::after{content:"+";font-size:17px;letter-spacing:0;}
  .data[open] .data-head::after{content:"−";}
  .data-body .ics-note{padding:12px 14px 0;margin-top:0;}
  .dbtn.danger{color:var(--red);margin-top:14px;}
  .dbtn{display:block;width:100%;padding:15px;background:var(--surface);border-top:1px solid var(--line);
        font-size:14px;font-weight:700;text-align:left;color:var(--gold);}
  .dbtn:active{background:var(--surface-hi);}

  /* ---------- how did that feel ---------- */
  .feel{margin-top:20px;padding:14px;background:var(--surface);border:1px solid var(--line);
        border-radius:12px;}
  .feel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .feel-was{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted);}
  .feel-row{display:flex;gap:8px;}
  .feel-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;
            border-radius:10px;background:var(--ink);border:1px solid var(--line);
            font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
  .feel-btn .face{opacity:.55;}
  .feel-btn.on{color:var(--text);}
  .feel-btn.on .face{opacity:1;}
  .feel-btn.bad.on{border-color:var(--red);background:rgba(224,96,90,.12);}
  .feel-btn.mid.on{border-color:var(--gold);background:rgba(224,176,72,.12);}
  .feel-btn.good.on{border-color:var(--green);background:rgba(63,191,127,.12);}
  .feel-btn.bad .face{color:var(--red);}
  .feel-btn.mid .face{color:var(--gold);}
  .feel-btn.good .face{color:var(--green);}
  .feel-tag{display:inline-flex;vertical-align:-6px;margin-right:6px;}
  .feel-tag .face{width:19px;height:19px;}
  .feel-tag.bad{color:var(--red);}
  .feel-tag.mid{color:var(--gold);}
  .feel-tag.good{color:var(--green);}
  .feel-was .feel-tag{margin-right:0;}
  .feel-was .feel-tag .face{width:16px;height:16px;}

  /* ---------- exercise photo ---------- */
  .shots{margin:14px 0 4px;}
  .shot{display:block;width:100%;padding:0;border-radius:12px;overflow:hidden;
        border:1px solid var(--line);background:var(--surface);}
  .shot img{display:block;width:100%;height:92px;object-fit:cover;}
  .shot.big img{height:auto;max-height:66vh;object-fit:contain;background:#000;}
  .shot-acts{display:flex;gap:8px;margin-top:6px;}
  .shot-act{flex:1;padding:9px;border-radius:8px;background:var(--surface);border:1px solid var(--line);
            font-size:13px;font-weight:700;color:var(--muted);}
  .shot-act.drop{color:var(--red);border-color:rgba(224,96,90,.35);}
  .addshot{margin:14px 0 4px;font-size:13px;}
  .vid.pic .play{font-size:13px;}

  .finish{margin-top:16px;padding:14px;background:var(--surface);border:1px solid var(--gold);
          border-radius:12px;}
  .finish .eyebrow{color:var(--gold);margin-bottom:10px;}
  .finish-row{display:flex;align-items:center;gap:12px;}
  .finish-lab{font-size:14px;font-weight:700;}
  .finish input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);
                border-radius:10px;padding:12px;font-size:17px;font-weight:800;color:var(--text);
                font-family:inherit;font-variant-numeric:tabular-nums;}
  .finish-note{margin-top:10px;font-size:12px;color:var(--muted);}

  /* ---------- progress grouping ---------- */
  .pgroup{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px;}
  .pgroup-head{padding:14px;background:var(--surface-hi);list-style:none;cursor:pointer;
               display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .pgroup-head::-webkit-details-marker{display:none;}
  .pgroup-name{font-size:14px;font-weight:800;}
  .pgone{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--red);}
  .pgroup-n{flex-shrink:0;font-size:11px;font-weight:700;color:var(--muted);}
  .pgroup-head::after{content:"+";font-size:17px;font-weight:800;color:var(--muted);}
  .pgroup[open] > .pgroup-head::after{content:"−";}
  .pgroup-body{padding:10px;}
  .pday{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px;}
  .pday:last-child{margin-bottom:0;}
  .pday-head{padding:12px 13px;background:var(--surface);list-style:none;cursor:pointer;
             display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .pday-head::-webkit-details-marker{display:none;}
  .pday-name{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;}

function linkFor(n, vid){

    ? { url:"https://youtu.be/"+id, label:"Watch demo", vetted:true }

/* ============================================================
   PLANS
   The program above is the built-in "Recommended" plan. It is never written
   to storage, so a future deploy can improve it and it costs nothing in the
   single state blob. state.plans holds only user-authored plans.
   ============================================================ */
const BUILTIN = { id:"builtin", name:"4-Day Upper/Lower", order:ORDER, sessions:SESSIONS };
/* Bump when the built-in programme's exercise ORDER changes. state.live is
   keyed by exercise index, so stale scratchpad entries would silently
   re-attach to whatever now sits at that position. */
const PROGRAM_V = 2;
const PROGRAM_CHANGED = ["upperA","lowerA","lowerB"];

const plan      = () => state.plans[state.planId] || BUILTIN;
const sess      = id => plan().sessions[id];
const order     = () => plan().order;
const allPlans  = () => [BUILTIN, ...Object.values(state.plans)];

/* ids only have to be unique inside this device's plan map */
let idSeq = 0;
const newId = pre => pre + Math.random().toString(36).slice(2,8) + (idSeq++).toString(36);

/* ============================================================
   STATE
   ============================================================ */
/* ============================================================
   STORAGE
   IndexedDB first (works offline from a downloaded file), then
   window.storage (the Claude preview sandbox), then memory.
   ============================================================ */
const KEY = "wk-v2";
/* mem is a MAP, not a single slot — once photos got their own keys, a
   one-value fallback would have let an image clobber the whole state. */
const DB = { mode:"memory", db:null, mem:{} };

function withTimeout(p, ms, label){
  return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error(label)), ms))]);
}

function idbOpen(){
  return new Promise((res,rej)=>{
    if(!globalThis.indexedDB) return rej(new Error("no indexedDB"));
    let req;
    try{ req = indexedDB.open("workout-log", 1); }catch(e){ return rej(e); }
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
    };
    req.onsuccess = e => res(e.target.result);
    req.onerror   = () => rej(req.error || new Error("idb open failed"));
    req.onblocked = () => rej(new Error("idb blocked"));
  });
}
function idbGet(db,k){
  return new Promise((res,rej)=>{
    const r = db.transaction("kv","readonly").objectStore("kv").get(k);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function idbSet(db,k,v){
  return new Promise((res,rej)=>{
    const t = db.transaction("kv","readwrite");
    t.objectStore("kv").put(v,k);
    t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
  });
}

async function storeGet(k){
  if(DB.mode==="idb")     return await idbGet(DB.db,k);
  if(DB.mode==="storage"){ const r = await window.storage.get(k); return r && r.value; }
  return DB.mem[k];
}
async function storeSet(k,v){
  if(DB.mode==="idb")     return await idbSet(DB.db,k,v);
  if(DB.mode==="storage") return await window.storage.set(k,v);
  DB.mem[k] = v;
}

const STORE_LABEL = {
  idb:"IndexedDB — saved on this device, works offline",
  storage:"Claude preview session",
  memory:"memory only — history will not survive a reload"
};

async function initStore(){
  /* 1. IndexedDB, with a timeout because it can hang in private browsing */
  try{
    DB.db = await withTimeout(idbOpen(), 3000, "idb timeout");
    DB.mode = "idb";
  }catch(e){
    /* 2. the sandbox's own async store */
    try{
      if(window.storage){ await window.storage.get(KEY); DB.mode = "storage"; }
    }catch(e2){ DB.mode = "memory"; }
  }

  /* if we landed on IndexedDB but it's empty, pull anything the sandbox
     already had so switching engines never looks like data loss */
  if(DB.mode==="idb"){
    try{
      const here = await idbGet(DB.db, KEY);
      if(!here && window.storage){
        const there = await window.storage.get(KEY);
        if(there && there.value) await idbSet(DB.db, KEY, there.value);
      }
    }catch(e){}
  }
}

let state = { v:2, view:"home", session:null, idx:0, units:"lb",
              live:{}, log:[], plans:{}, planId:"builtin", draft:null, rest:null, notify:false, pv:0, startedAt:null, feel:{} };
let sheet = null;
let writeChain = Promise.resolve();

async function load(){
  await initStore();
  try{
    const raw = await storeGet(KEY);
    if(raw) Object.assign(state, JSON.parse(raw));
  }catch(e){}
  let dirty = migrate();
  state.log.forEach(r=>{ if(!r.id){ r.id = mkId(r); dirty=true; } });
  /* a rest that ran out ten minutes ago is noise, not state — don't reopen
     the rest screen on top of the app the next time it's launched */
  if(state.rest && Date.now() - state.rest.endsAt > 6e5){ state.rest = null; dirty = true; }
  /* drop in-progress sets for built-in sessions whose exercise order moved */
  if(state.pv !== PROGRAM_V){
    PROGRAM_CHANGED.forEach(sid=>{
      const pre = "builtin:"+sid+":";
      Object.keys(state.live).forEach(k=>{ if(k.startsWith(pre)) delete state.live[k]; });
    });
    state.pv = PROGRAM_V; dirty = true;
  }
  if(dirty) save();
}

/* v1 stored a single hardcoded program. Same storage key, so no history is
   lost — the old shape just gets the plan fields it never had. */
function migrate(){
  if(state.v === 2 && state.plans) return false;
  state.plans  = state.plans  || {};
  state.feel   = state.feel   || {};
  state.planId = state.planId || "builtin";
  state.draft  = state.draft  || null;

  /* live keys gained a plan segment, or a duplicated plan would share a
     scratchpad with its original */
  const live = {};
  Object.entries(state.live || {}).forEach(([k,v])=>{
    live[k.split(":").length === 2 ? "builtin:"+k : k] = v;
  });
  state.live = live;

  /* records must carry their own kind — the plan they came from can be
     deleted later, and history still has to render */
  state.log.forEach(r=>{
    if(!r.planId) r.planId = "builtin";
    if(!r.kind){
      const s = BUILTIN.sessions[r.session];
      if(s) r.kind = s.kind;
    }
  });

  state.v = 2;
  return true;
}

/* writes are chained so rapid taps can't land out of order */
function save(){
  const snapshot = JSON.stringify(state);
  writeChain = writeChain.then(()=>storeSet(KEY, snapshot)).catch(()=>{});
  return writeChain;
}

/* typing in the plan editor would otherwise serialise the whole state on
   every keystroke */
let saveTimer = null;
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); }

const mkId = r => (r.day || String(r.date).slice(0,10)) + "-" + r.session + "-" +

/* scoped by plan — two plans can hold the same session id, and a duplicated
   plan must not inherit the original's half-finished sets */
const lk = (s,i) => state.planId+":"+s+":"+i;
const liveSets = (s,i) => state.live[lk(s,i)] || [];

function sessionProgress(s){
  let total=0, got=0;
  const S = sess(s);
  if(!S) return { got:0, total:0, pct:0 };
  S.ex.forEach((e,i)=>{ total+=e.sets; got+=liveSets(s,i).length; });
  return { got, total, pct: total ? got/total : 0 };
}

/* most recent completed record for a named exercise */
function lastTime(name){
  for(let i=state.log.length-1;i>=0;i--){
    const sets = state.log[i].entries[name];
    if(sets && sets.length) return { date:state.log[i].date, sets };
  }
  return null;
}

/* How an exercise felt: optional, one of three, kept per exercise the same
   way sets are. Drawn rather than emoji so the three read as red/amber/green
   at a glance and match the palette. */
const FEELS = [
  { v:1, label:"Rough",  cls:"bad",  mouth:"M8 15.5 Q12 11.5 16 15.5" },
  { v:2, label:"OK",     cls:"mid",  mouth:"M8.5 14 L15.5 14" },
  { v:3, label:"Strong", cls:"good", mouth:"M8 12 Q12 16 16 12" }
];
/* whitelisted, because records arrive from imported files too */
const feelOf = v => FEELS.find(f => f.v === Number(v)) || null;

const faceSvg = f => `<svg class="face" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
  <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
  <circle cx="9" cy="9.8" r="1.25" fill="currentColor"/>
  <circle cx="15" cy="9.8" r="1.25" fill="currentColor"/>
  <path d="${f.mouth}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
</svg>`;

/* a small inline marker for history rows */
const feelTag = v => { const f = feelOf(v);
  return f ? `<span class="feel-tag ${f.cls}" title="${escA(f.label)}">${faceSvg(f)}</span>` : ""; };

const feelKey = (s,i) => lk(s,i);
const liveFeel = (s,i) => (state.feel || {})[feelKey(s,i)] || null;

function setFeel(i, v){
  const s = state.session;
  state.feel = state.feel || {};
  const k = feelKey(s,i);
  if(state.feel[k] === v) delete state.feel[k];   // tapping the same face clears it
  else state.feel[k] = v;
  save(); render();
}

/* the rating from the last session that recorded one for this lift */
function lastFeel(name){
  for(let i=state.log.length-1; i>=0; i--){
    const f = state.log[i].feel;
    if(f && f[name] && feelOf(f[name])) return Number(f[name]);
  }
  return null;
}

/* the same set number from the last session that logged this exercise.
   No clamping — if last time had fewer sets, there is no match for this one. */
function prevSet(name, n){
  const p = lastTime(name);
  return (p && p.sets[n-1]) || null;
}

/* Past this we stop guessing and ask, because the gap is a tab left open
   rather than a workout that actually ran that long. */
const SESSION_MAX = 6 * 3600;
/* ...and however late you answer, a hand-entered session is capped here. */
const MANUAL_MAX = 2 * 3600;

const openSecs = () => state.startedAt ? Math.round((Date.now() - state.startedAt) / 1000) : 0;
const isStale  = () => openSecs() > SESSION_MAX;

const hhmm = ms => { const d = new Date(ms);
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };

/* What the picker will save. finishPick is null until you touch it, so the
   view and saveWorkout() agree on the default rather than showing one number
   and storing another. */
const finishValue = () => finishPick !== null ? finishPick : hhmm(state.startedAt + 3600000);

/* "HH:MM" read against the start date, rolling into the next day when it reads
   earlier than the start — finishing after midnight is the ordinary case for a
   session you're only now getting round to saving. */
function pickedDur(t){
  if(!state.startedAt || !/^\d{1,2}:\d{2}$/.test(t || "")) return null;
  const raw = new Date(state.startedAt), p = t.split(":").map(Number);
  /* the input only has minute resolution, so drop the start's seconds too —
     otherwise a nominal one-hour default reads back as 59 min */
  const st = new Date(raw.getFullYear(), raw.getMonth(), raw.getDate(),
                      raw.getHours(), raw.getMinutes(), 0, 0);
  const fin = new Date(st.getFullYear(), st.getMonth(), st.getDate(), p[0], p[1], 0, 0);
  let sec = Math.round((fin - st) / 1000);
  if(sec < 0) sec += 86400;
  return sec < 60 ? null : Math.min(sec, MANUAL_MAX);
}

/* Recomputed as you type, without a re-render — replacing #app mid-edit
   would close the native time picker. */
function finishNote(){
  const d = pickedDur(finishValue());
  if(d === null) return "No length will be saved.";
  const capped = pickedDur(finishValue()) === MANUAL_MAX;
  return "That's " + fmtDur(d) + (capped ? " — capped at 2 hours" : "");
}

function fmtDur(sec){
  if(!sec || sec < 60) return sec ? "<1 min" : "";
  const h = Math.floor(sec/3600), m = Math.round((sec%3600)/60);
  return h ? h+"h "+String(m).padStart(2,"0")+"m" : m+" min";
}

const round1 = n => Math.round((Number(n)||0) * 10) / 10;
const setLabel = s => (Number(s.w) ? round1(s.w)+"×"+s.r : "BW×"+s.r);

function volume(entries){
  let v=0;
  Object.values(entries).forEach(sets => sets.forEach(x => v += (x.w||0)*(x.r||0)));
  return Math.round(v);
}

/* ============================================================
   TIME LAYER
   Temporal where the browser has it (Chrome/Edge 144+, Firefox 139+),
   Date fallback otherwise (Safari/iOS as of mid-2026). No polyfill —
   this file has to work offline in a gym.
   ============================================================ */
const HAS_TEMPORAL = typeof globalThis.Temporal !== "undefined";
const pad = n => String(n).padStart(2,"0");

const T = {
  /* IANA zone id, e.g. America/Vancouver */
  zone(){
    try{
      return HAS_TEMPORAL ? Temporal.Now.timeZoneId()
                          : Intl.DateTimeFormat().resolvedOptions().timeZone;
    }catch(e){ return "UTC"; }
  },

  /* today's calendar date where the user actually is */
  today(){
    if(HAS_TEMPORAL){ try{ return Temporal.Now.plainDateISO().toString(); }catch(e){} }
    const d=new Date();
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  },

  /* which calendar day an instant fell on, in the zone it was logged in */
  dayOf(iso, zone){
    if(HAS_TEMPORAL){
      try{ return Temporal.Instant.from(iso).toZonedDateTimeISO(zone||T.zone()).toPlainDate().toString(); }catch(e){}
    }
    const d=new Date(iso);
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  },

  /* exact calendar days between two YYYY-MM-DD strings.
     Plain ms subtraction gets this wrong across DST — a day is 23 or 25 hours
     twice a year in Vancouver. */
  daysBetween(a,b){
    if(HAS_TEMPORAL){
      try{
        return Temporal.PlainDate.from(a).until(Temporal.PlainDate.from(b),{largestUnit:"day"}).days;
      }catch(e){}
    }
    const utc = s => { const p=s.split("-").map(Number); return Date.UTC(p[0],p[1]-1,p[2]); };
    return Math.round((utc(b)-utc(a))/864e5);
  },

  /* a YYYY-MM-DD string is a calendar date, not an instant.
     new Date("2026-07-27") parses as UTC midnight and renders as the 26th
     in Vancouver — so build it from parts instead. */
  fmtDay(s){
    const p=s.split("-").map(Number);
    return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  },

  parts(s){ const p=s.split("-").map(Number); return {y:p[0], m:p[1], d:p[2]}; }
};

const fmtDate = iso => new Date(iso).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
const setStr  = sets => sets.map(x => x.w ? x.w+"×"+x.r : "BW×"+x.r).join("  ");

/* the calendar day a record belongs to — stored at save time so it stays
   correct even if the user later opens the app in another time zone */
const recDay = r => r.day || T.dayOf(r.date, r.zone);

/* Read the kind off the record, never off the plan — the plan it came from
   may since have been deleted, and the calendar still has to paint. */
const recKind = r => r.kind
  || (BUILTIN.sessions[r.session] && BUILTIN.sessions[r.session].kind)
  || "full";

function logsByDay(){
  const map={};
  state.log.forEach(r=>{ const k=recDay(r); (map[k]=map[k]||[]).push(r); });
  return map;
}

/* average calendar days between training days — the program wants ~1.5-2 */
function avgGap(){
  const days=[...new Set(state.log.map(recDay))].sort();
  if(days.length<2) return null;
  let t=0;
  for(let i=1;i<days.length;i++) t += T.daysBetween(days[i-1], days[i]);
  return (t/(days.length-1)).toFixed(1);
}

/* ---- .ics export: the only way a web page can reach a real calendar app ---- */
const icsEsc = t => String(t).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
const icsStamp = d => d.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";

function fold(line){
  if(line.length<=74) return line;
  let out=line.slice(0,74), rest=line.slice(74);
  while(rest.length>73){ out+="\r\n "+rest.slice(0,73); rest=rest.slice(73); }
  return out+"\r\n "+rest;
}

function buildICS(){
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//4-Day Plan//Workout Log//EN",
           "CALSCALE:GREGORIAN","X-WR-CALNAME:Workouts","X-WR-TIMEZONE:"+T.zone()];
  state.log.forEach((r,n)=>{
    const start=new Date(r.date), end=new Date(start.getTime()+45*60000);
    const desc=Object.entries(r.entries).map(([nm,s])=>nm+": "+setStr(s)).join("\n")
             + "\n\nTotal volume: "+volume(r.entries)+" "+state.units;
    L.push("BEGIN:VEVENT",
      "UID:"+start.getTime()+"-"+n+"@4dayplan",
      "DTSTAMP:"+icsStamp(new Date()),
      "DTSTART:"+icsStamp(start),
      "DTEND:"+icsStamp(end),
      fold("SUMMARY:"+icsEsc("🏋 "+r.name)),
      fold("DESCRIPTION:"+icsEsc(desc)),
      "END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}

/* ============================================================
   EXPORT / IMPORT — moving logs between devices
   ============================================================ */
function download(name, text, mime){
  try{
    const url = URL.createObjectURL(new Blob([text],{type:mime}));
    const a = document.createElement("a");
    a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    return true;
  }catch(e){ return false; }
}

async function exportJSON(){
  const mine = Object.values(state.plans);
  if(!state.log.length && !mine.length){ alert("Nothing logged or created yet."); return; }
  /* photos ride along — this is the only path off the device, and losing your
     form references on a phone swap would be a nasty surprise. They dominate
     the file size, so they're the reason an export can run to megabytes. */
  const images = {};
  await Promise.all(knownExercises().map(async n=>{
    const v = await loadImg(n);
    if(v) images[n] = v;
  }));
  const payload = JSON.stringify({
    format:"4dayplan-log", version:3,
    exported:new Date().toISOString(), zone:T.zone(),
    units:state.units, log:state.log,
    plans: mine.map(packPlan),     // backup path; links are the sharing path
    images
  }, null, 2);
  const stamp = T.today();
  if(!download("workout-log-"+stamp+".json", payload, "application/json"))
    alert("Download blocked here. Open the file outside the preview and it'll work.");
}

function exportICS(){
  if(!state.log.length){ alert("Nothing logged yet."); return; }
  if(!download("workouts.ics", buildICS(), "text/calendar;charset=utf-8"))
    alert("Download blocked here. Open the file outside the preview and it'll work.");
}

/* merge rather than replace, so importing never destroys what's on this device */
function mergeLog(incoming){
  const seen = new Set(state.log.map(r=>r.id || mkId(r)));
  let added=0, dupes=0, bad=0;
  incoming.forEach(r=>{
    /* deliberately does NOT require the session to exist locally — a log
       exported from someone else's plan is still valid history */
    if(!r || !r.date || !r.session || !r.entries || typeof r.entries !== "object"){ bad++; return; }
    const id = r.id || mkId(r);
    if(seen.has(id)){ dupes++; return; }
    seen.add(id);
    state.log.push({ ...r, id });
    added++;
  });
  state.log.sort((a,b)=> new Date(a.date) - new Date(b.date));
  return { added, dupes, bad };
}

function importJSON(file){
  const finish = txt => {
    let data;
    try{ data = JSON.parse(txt); }
    catch(e){ alert("That file isn't valid JSON."); return; }
    const list = Array.isArray(data) ? data : data.log;
    const incoming = Array.isArray(data.plans) ? data.plans : [];
    if(!Array.isArray(list) && !incoming.length){ alert("No workout log or plans found in that file."); return; }
    if(data.format && data.format!=="4dayplan-log"){
      if(!confirm("That file wasn't exported by this app. Try importing anyway?")) return;
    }
    const r = Array.isArray(list) ? mergeLog(list) : { added:0, dupes:0, bad:0 };

    /* same validation as a shared link — a file is no more trustworthy */
    let plans = 0;
    incoming.forEach(raw=>{
      const p = unpackPlan(raw);
      if(!p) return;
      state.plans[p.id] = p; plans++;
    });

    /* same posture as everything else off-device: only obvious image data
       gets through, capped so one file can't fill the origin's quota */
    let pics = 0;
    if(data.images && typeof data.images === "object"){
      Object.keys(data.images).slice(0, 200).forEach(n=>{
        const v = data.images[n];
        if(typeof n !== "string" || !n || typeof v !== "string") return;
        if(!/^data:image\/(png|jpeg|jpg|webp|gif);base64,/.test(v) || v.length > IMG_CAP) return;
        IMG[n] = v; storeSet(IMG_KEY(n), v); pics++;
      });
    }

    save();
    state.view="history"; state.tab="list"; render();
    alert("Imported "+r.added+" workout"+(r.added===1?"":"s")+"."
      + (pics      ? "\nRestored "+pics+" form photo"+(pics===1?"":"s")+"." : "")
      + (plans     ? "\nAdded "+plans+" plan"+(plans===1?"":"s")+"." : "")
      + (r.dupes ? "\nSkipped "+r.dupes+" already on this device." : "")
      + (r.bad   ? "\nSkipped "+r.bad+" unreadable entries." : ""));
  };
  if(file.text) file.text().then(finish).catch(()=>alert("Couldn't read that file."));
  else{ const fr=new FileReader(); fr.onload=()=>finish(fr.result); fr.readAsText(file); }
}

function pickImport(){
  const inp = document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange = () => { if(inp.files && inp.files[0]) importJSON(inp.files[0]); };
  inp.click();
}

/* ============================================================
   EXERCISE PHOTOS

   A form reminder you can actually read mid-set: YouTube in a gym means ads
   and a signal you don't have. Photos live under their own storage keys and
   NEVER inside the state blob — save() re-serialises all of state on every
   logged set, and a few hundred KB of base64 in there would make that crawl.

   Keyed by exercise NAME, like lastTime() and exerciseStats(), so a lift keeps
   its photo when it moves between plans.
   ============================================================ */
const IMG_KEY = n => "img:" + n;
const IMG = {};              // name -> dataURL | null (null = looked, none there)
const IMG_MAX = 900;         // px on the long edge
const IMG_Q = 0.7;
const IMG_CAP = 2e6;         // refuse anything absurd arriving from an import
let shotOpen = null;         // which photo is enlarged; transient like `sheet`
let finishPick = null;       // "HH:MM" typed on the save page for a stale session

const imgSearch = n =>
  "https://www.google.com/search?tbm=isch&q=" + encodeURIComponent(n + " exercise proper form");

async function loadImg(name){
  if(IMG[name] !== undefined) return IMG[name];
  try{ IMG[name] = (await storeGet(IMG_KEY(name))) || null; }
  catch(e){ IMG[name] = null; }
  return IMG[name];
}
/* render() is synchronous, so a session's photos are fetched up front and the
   view is drawn again once they land */
async function loadImgs(sid){
  const S = sess(sid);
  if(!S) return;
  await Promise.all(S.ex.map(e => loadImg(e.name)));
}

/* Downscaled before storing — phone cameras produce multi-megabyte files and
   this shares an IndexedDB with everything else. */
function shrinkImg(file){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("unreadable"));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error("not an image"));
      im.onload = () => {
        const k = Math.min(1, IMG_MAX / Math.max(im.width, im.height) || 1);
        const c = document.createElement("canvas");
        c.width  = Math.max(1, Math.round(im.width  * k));
        c.height = Math.max(1, Math.round(im.height * k));
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        try{ res(c.toDataURL("image/jpeg", IMG_Q)); }catch(e){ rej(e); }
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function pickPhoto(name){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";   // Android offers the camera here too
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if(!f) return;
    try{
      const url = await shrinkImg(f);
      IMG[name] = url;
      await storeSet(IMG_KEY(name), url);
      shotOpen = name;
      render();
    }catch(e){ alert("Couldn't read that image."); }
  };
  inp.click();
}

async function dropPhoto(name){
  if(!confirm("Remove the saved photo for " + name + "?")) return;
  IMG[name] = null;
  shotOpen = null;
  try{ await storeSet(IMG_KEY(name), ""); }catch(e){}
  render();
}

/* Every exercise name this device knows about — lets the JSON backup gather
   photos without enumerating storage keys. */
function knownExercises(){
  const names = new Set();
  allPlans().forEach(p => p.order.forEach(sid=>{
    const S = p.sessions[sid];
    if(S) S.ex.forEach(e => names.add(e.name));
  }));
  state.log.forEach(r=>{
    if(r && r.entries && typeof r.entries === "object") Object.keys(r.entries).forEach(n => names.add(n));
  });
  return [...names];
}

/* ============================================================
   SHARE — a whole plan as a link

   The payload rides in the hash, not the query string, for two reasons:
   GitHub Pages never receives it (no 404, nothing in server logs), and the
   service worker's cache-first match ignores the hash, so a shared link
   still opens offline.

   Measured: a 4-session x 5-exercise plan with every coaching field filled
   is ~6.5 KB of JSON, 384 B deflated, a 560-character URL.
   ============================================================ */
const S_MAX = 14, E_MAX = 50, TXT_MAX = 400, NAME_MAX = 60, WU_MAX = 20;

const clampS = (v,max) => typeof v === "string" ? v.slice(0,max) : "";
const clampN = (v,lo,hi,dflt) => {
  const n = Math.round(Number(v));
  return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : dflt;
};

/* short keys keep the uncompressed fallback viable on browsers without
   CompressionStream — deflate barely cares, but that path has no help */
function packPlan(p){
  const s = {};
  p.order.forEach(id=>{
    const S = p.sessions[id];
    if(!S) return;
    s[id] = { n:S.name, k:S.kind, e:S.ex.map(e=>{
      const o = { n:e.name, x:e.sets, r:e.reps, l:e.lo, t:e.rest };
      if(e.alt)    o.a  = e.alt;
      if(e.altVid) o.av = e.altVid;
      if(e.ok)     o.ok = e.ok;
      if(e.no)     o.no = e.no;
      if(e.cue)    o.c  = e.cue;
      if(e.warn)   o.w  = e.warn;
      if(e.vid)    o.v  = e.vid;
      return o;
    })};
    if(S.warmup && S.warmup.length)   s[id].u = S.warmup;
    if(S.cooldown && S.cooldown.length) s[id].c = S.cooldown;
  });
  return { f:"wq", v:1, n:p.name, o:p.order.filter(id=>p.sessions[id]), s };
}

/* Everything here arrives from someone else's phone, so nothing is trusted:
   types checked, kinds whitelisted, numbers clamped, strings truncated,
   counts capped, and a fresh id minted so an import can never overwrite a
   plan already on this device. */
function unpackPlan(d){
  if(!d || typeof d !== "object" || d.f !== "wq") return null;
  if(!Array.isArray(d.o) || !d.s || typeof d.s !== "object") return null;

  const sessions = {}, ord = [];
  d.o.slice(0, S_MAX).forEach(id=>{
    if(typeof id !== "string") return;
    const S = d.s[id];
    if(!S || typeof S !== "object" || !Array.isArray(S.e)) return;

    const ex = [];
    S.e.slice(0, E_MAX).forEach(e=>{
      if(!e || typeof e !== "object") return;
      const name = clampS(e.n, NAME_MAX).trim();
      if(!name) return;
      const o = {
        name,
        sets: clampN(e.x, 1, 20, 3),
        reps: clampS(e.r, 24).trim() || "8–12",
        lo:   clampN(e.l, 1, 100, 8),
        rest: clampN(e.t, 0, 600, 90)
      };
      const alt=clampS(e.a,TXT_MAX), av=clampS(e.av,NAME_MAX), ok=clampS(e.ok,TXT_MAX),
            no=clampS(e.no,TXT_MAX), cue=clampS(e.c,TXT_MAX), warn=clampS(e.w,TXT_MAX),
            vid=okVid(e.v);
      if(alt) o.alt=alt;   if(av) o.altVid=av;  if(ok) o.ok=ok;
      if(no)  o.no=no;     if(cue) o.cue=cue;   if(warn) o.warn=warn;
      if(vid) o.vid=vid;
      ex.push(o);
    });
    if(!ex.length) return;

    /* session ids are internal and end up in data-* attributes — mint fresh
       ones rather than trust an object key that came from a link */
    const sid = newId("s");
    sessions[sid] = {
      name: clampS(S.n, NAME_MAX).trim() || "Session",
      kind: KINDS.includes(S.k) ? S.k : "full",
      ex
    };
    [["u","warmup"],["c","cooldown"]].forEach(([k,field])=>{
      if(!Array.isArray(S[k])) return;
      const lines = S[k].slice(0, WU_MAX).map(t => clampS(t, TXT_MAX).trim()).filter(Boolean);
      if(lines.length) sessions[sid][field] = lines;
    });
    ord.push(sid);
  });

  if(!ord.length) return null;
  return { id:newId("p"), name: clampS(d.n, NAME_MAX).trim() || "Shared plan", order:ord, sessions };
}

/* base64url over bytes. Always via TextEncoder — bare btoa() on a string
   throws the moment a plan name contains a non-Latin-1 character. */
const B64 = {
  enc(bytes){
    let s = "";
    for(let i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  },
  dec(str){
    const s = atob(str.replace(/-/g,"+").replace(/_/g,"/"));
    const out = new Uint8Array(s.length);
    for(let i=0;i<s.length;i++) out[i] = s.charCodeAt(i);
    return out;
  }
};

async function encPlan(p){
  const raw = new TextEncoder().encode(JSON.stringify(packPlan(p)));
  if(typeof CompressionStream !== "undefined"){
    try{
      const cs = new CompressionStream("deflate-raw");
      const w = cs.writable.getWriter();
      /* the writer's own promises reject separately from the read side —
         unhandled, a damaged payload becomes an uncaught rejection */
      w.write(raw).catch(()=>{}); w.close().catch(()=>{});
      return "z" + B64.enc(new Uint8Array(await new Response(cs.readable).arrayBuffer()));
    }catch(e){}
  }
  return "j" + B64.enc(raw);
}

async function decPlan(code){
  try{
    const body = B64.dec(code.slice(1));
    let bytes = body;
    if(code[0] === "z"){
      if(typeof DecompressionStream === "undefined") return null;
      const ds = new DecompressionStream("deflate-raw");
      const w = ds.writable.getWriter();
      w.write(body).catch(()=>{}); w.close().catch(()=>{});
      bytes = new Uint8Array(await new Response(ds.readable).arrayBuffer());
    } else if(code[0] !== "j") return null;
    return unpackPlan(JSON.parse(new TextDecoder().decode(bytes)));
  }catch(e){ return null; }
}

const planURL = async p => location.origin + location.pathname + "#p=" + await encPlan(p);
const shareCode = () => { const m = /[#&]p=([A-Za-z0-9_-]+)/.exec(location.hash); return m ? m[1] : null; };
const clearHash = () => { try{ window.history.replaceState(null,"",location.pathname+location.search); }catch(e){} };

async function sharePlan(id){
  const p = planById(id);
  if(!p) return;
  let url;
  try{ url = await planURL(p); }
  catch(e){ alert("Couldn't build a link for that plan."); return; }

  if(navigator.share){
    try{ await navigator.share({ title:p.name, text:"Workout plan: "+p.name, url }); return; }
    catch(e){ if(e && e.name === "AbortError") return; }
  }
  try{
    await navigator.clipboard.writeText(url);
    alert("Link copied.\n\nAnyone who opens it can save this plan to their own device.");
    return;
  }catch(e){}
  /* last resort — no share sheet, no clipboard permission */
  state.shareUrl = url; save(); render();
}

/* ============================================================
   PLAN ACTIONS
   ============================================================ */
function usePlan(id){
  if(!planById(id)) return;
  state.planId = id; state.view="home"; state.session=null; state.idx=0;
  sheet=null; stopRest(); save(); render();
}

const blankEx = () => ({ name:"", sets:3, reps:"8–12", lo:8, rest:90 });
const blankSession = n => ({ name:n||"Day 1", kind:"full",
                             warmup:[...WARMUP.full], cooldown:[...COOLDOWN.full], ex:[blankEx()] });

function startDraft(p, srcId){
  const d = p ? JSON.parse(JSON.stringify(p)) : null;
  const sid = newId("s");
  state.draft = d
    ? { ...d, srcId: srcId || null, tab: d.order[0] }
    : { id:newId("p"), name:"", order:[sid], sessions:{ [sid]:blankSession() }, srcId:null, tab:sid };
  state.view="editor"; save(); window.scrollTo(0,0); render();
}

function newPlan(){ startDraft(null); }
function editPlan(id){ const p=planById(id); if(p && p.id!=="builtin") startDraft(p, id); }

function dupPlan(id){
  const p = planById(id);
  if(!p) return;
  const c = JSON.parse(JSON.stringify(p));
  c.id = newId("p");
  c.name = (p.name + " copy").slice(0, NAME_MAX);
  startDraft(c, null);
}

function delPlan(id){
  const p = state.plans[id];
  if(!p) return;
  if(!confirm("Delete \""+p.name+"\"?\n\nWorkouts you already saved from it stay in your history.")) return;
  delete state.plans[id];
  Object.keys(state.live).forEach(k=>{ if(k.startsWith(id+":")) delete state.live[k]; });
  if(state.planId === id){ state.planId = "builtin"; state.session=null; state.idx=0; }
  save(); render();
}

function saveDraft(){
  const d = state.draft;
  if(!d) return;
  const name = (d.name||"").trim();
  if(!name){ alert("Give the plan a name first."); return; }

  const sessions = {}, ord = [];
  d.order.forEach(sid=>{
    const S = d.sessions[sid];
    if(!S) return;
    const ex = S.ex.filter(e => (e.name||"").trim());
    if(!ex.length) return;
    const lines = v => (Array.isArray(v) ? v : String(v||"").split("\n"))
      .map(t => String(t).trim().slice(0,TXT_MAX)).filter(Boolean).slice(0, WU_MAX);
    const wu = lines(S.warmup), cd = lines(S.cooldown);
    sessions[sid] = {
      name:(S.name||"").trim() || "Session",
      kind: KINDS.includes(S.kind) ? S.kind : "full",
      ...(wu.length ? { warmup: wu } : {}),
      ...(cd.length ? { cooldown: cd } : {}),
      ex: ex.map(e=>{
        const o = { name:e.name.trim(), sets:clampN(e.sets,1,20,3),
                    reps:(e.reps||"").trim() || "8–12",
                    lo:clampN(e.lo,1,100,8), rest:clampN(e.rest,0,600,90) };
        ["alt","altVid","ok","no","cue","warn"].forEach(f=>{
          const v = (e[f]||"").trim(); if(v) o[f] = v.slice(0,TXT_MAX);
        });
        const vid = okVid((e.vid||"").trim()); if(vid) o.vid = vid;
        return o;
      })
    };
    ord.push(sid);
  });

  if(!ord.length){ alert("Add at least one session with a named exercise."); return; }

  state.plans[d.id] = { id:d.id, name:name.slice(0,NAME_MAX), order:ord, sessions };
  state.draft = null;
  state.view = "plans";
  save(); render();
}

function cancelDraft(){
  if(state.draft && !confirm("Discard changes to this plan?")) return;
  state.draft = null; state.view="plans"; save(); render();
}

/* structural edits re-render; field edits deliberately do not (see wire) */
function edAddEx(){ state.draft.sessions[state.draft.tab].ex.push(blankEx()); save(); render(); }
function edDelEx(i){
  const S = state.draft.sessions[state.draft.tab];
  S.ex.splice(i,1);
  if(!S.ex.length) S.ex.push(blankEx());
  save(); render();
}
function edMoveEx(i,d){
  const ex = state.draft.sessions[state.draft.tab].ex, j = i+d;
  if(j<0 || j>=ex.length) return;
  [ex[i], ex[j]] = [ex[j], ex[i]];
  save(); render();
}
function edAddSession(){
  const d = state.draft;
  if(d.order.length >= S_MAX){ alert("That's the most sessions a plan can hold."); return; }
  const sid = newId("s");
  d.sessions[sid] = blankSession("Day "+(d.order.length+1));
  d.order.push(sid); d.tab = sid;
  save(); render();
}
function edDelSession(){
  const d = state.draft;
  if(d.order.length <= 1){ alert("A plan needs at least one session."); return; }
  if(!confirm("Remove this session from the plan?")) return;
  delete d.sessions[d.tab];
  d.order = d.order.filter(x => x !== d.tab);
  d.tab = d.order[0];
  save(); render();
}

/* ============================================================
   SHARED-LINK IMPORT
   ============================================================ */
async function checkShareLink(){
  const code = shareCode();
  if(!code) return false;
  clearHash();
  const p = await decPlan(code);
  if(!p){ alert("That plan link is damaged or from a newer version of the app."); return false; }
  state.pending = p; state.view = "import";
  return true;
}

/* for when a link arrives as text rather than as a tap — e.g. copied out of
   a chat the browser won't hand off */
async function pasteLink(){
  const txt = prompt("Paste the plan link:");
  if(!txt) return;
  const m = /[#&]p=([A-Za-z0-9_-]+)/.exec(txt.trim());
  if(!m){ alert("That doesn't look like a plan link."); return; }
  const p = await decPlan(m[1]);
  if(!p){ alert("That plan link is damaged or from a newer version of the app."); return; }
  state.pending = p; state.view="import"; save(); render();
}

function acceptShared(){
  const p = state.pending;
  if(!p) return;
  state.plans[p.id] = { id:p.id, name:p.name, order:p.order, sessions:p.sessions };
  state.pending = null; state.view = "plans";
  save(); render();
}
function rejectShared(){ state.pending=null; state.view="home"; save(); render(); }

/* ============================================================
   REST TIMER
   ============================================================ */
/* The countdown is a DEADLINE (state.rest.endsAt), never a tick count.
   A hidden page has its timers throttled to about once a minute, or frozen
   outright — anything that decremented per tick would quietly drift long, so
   you'd lock the phone mid-rest and unlock to a timer still claiming a minute
   left. Deriving the number from the clock makes a missed tick cost nothing.
   timer.id is just the repaint handle and stays transient. */
let timer = { id:null };
const buzz = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };
const restLeft = () => state.rest ? Math.round((state.rest.endsAt - Date.now())/1000) : 0;

let wakeLock = null;
async function keepAwake(){ try{ wakeLock = await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState !== "visible") return;
  if(state.session) keepAwake();   // the lock is auto-released while hidden
  /* the next throttled tick could be up to a minute out — repaint now */
  if(state.rest){ runRest(); paintRest(); if(restLeft() <= 0) closeRestNote(); }
});

function runRest(){
  clearInterval(timer.id);
  timer.id = setInterval(()=>{
    if(!state.rest) return;
    if(restLeft() <= 0 && !state.rest.buzzed){
      state.rest.buzzed = true;
      /* whichever channel is actually available right now: in-page vibration
         needs visibility, the notification works while hidden */
      if(document.visibilityState === "visible") buzz([200,100,200]);
      else showRestNote(true);
      save();
    }
    paintRest();
  }, 1000);
}

function startRest(sec, note, logged){
  state.rest = { endsAt: Date.now() + sec*1000, note, logged, buzzed:false };
  save(); runRest(); showRestNote(false); render();
}
function clearRest(){ clearInterval(timer.id); timer.id=null; state.rest=null; closeRestNote(); }
function stopRest(){ clearRest(); save(); render(); }

/* Weight ladder: the union of the 2s and the 2.5s, ascending —
   0, 2, 2.5, 4, 5, 6, 7.5, 8, 10, 12, 12.5, 14, 15, 17.5, 18, 20 …
   Machine stacks come in both, so a single fixed step always missed half the
   pins. Derived rather than tabulated, so it keeps going as high as you lift,
   and it lands on the neighbouring rung from an off-ladder number too (13 → 14
   going up, 12.5 going down) — typed weights and old history stay usable. */
const LADDER = [2, 2.5];
function wStep(w, dir){
  const E = 1e-9, cur = Number(w) || 0;
  const next = LADDER.map(m => (Math.floor(cur/m + E) + 1) * m);
  const prev = LADDER.map(m => (Math.ceil(cur/m - E) - 1) * m);
  const v = dir > 0 ? Math.min(...next) : Math.max(...prev);
  return Math.max(0, Math.round(v * 10) / 10);
}

function fmtT(s){
  const neg = s<0; s = Math.abs(s);
  return (neg?"+":"") + Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}
function paintRest(){
  const el = document.getElementById("restTime");
  if(!el) return;
  const l = restLeft();
  el.textContent = fmtT(l);
  el.classList.toggle("over", l<=0);
}

/* ============================================================
   REST NOTIFICATIONS

   A web page cannot schedule a notification for a future time — Notification
   Triggers was an origin trial and never shipped — so the "done" alert is
   fired by our own timer. If Android freezes or evicts the tab it lands late,
   on the next wake, or not at all. That is why the ongoing notification spells
   out the target clock time: it stays useful even when the alert doesn't
   arrive on the second.

   Android forbids the `new Notification()` constructor, so everything goes
   through the service worker registration.
   ============================================================ */
const REST_TAG = "rest";
const canNotify = () => typeof Notification !== "undefined" && !!navigator.serviceWorker;
const swReg = async () => { try{ return await navigator.serviceWorker.getRegistration(); }catch(e){ return null; } };

async function toggleNotify(){
  if(state.notify){ state.notify=false; save(); closeRestNote(); render(); return; }
  let p = Notification.permission;
  if(p === "default"){ try{ p = await Notification.requestPermission(); }catch(e){} }
  if(p !== "granted"){
    alert("Notifications are blocked for this site.\n\nTurn them back on in your browser's site settings, then try again.");
    return;
  }
  state.notify = true; save(); render();
  if(state.rest) showRestNote(false);
}

async function showRestNote(done){
  if(!state.notify || !canNotify() || Notification.permission !== "granted") return;
  const r = state.rest;
  if(!r) return;
  const reg = await swReg();
  if(!reg || !reg.showNotification) return;
  const at = new Date(r.endsAt).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
  const opt = {
    tag: REST_TAG,            // one rest notification, replaced in place
    renotify: done,
    icon: "icon-192.png",
    requireInteraction: false,
    body: done ? (r.note || "Back to it.") : "Until " + at + (r.note ? " · " + r.note : "")
  };
  /* silent:true suppresses vibration as well as sound, so it's only right for
     the ongoing one. The finish buzzes via the notification's own vibrate —
     navigator.vibrate() is ignored while the page is hidden. */
  if(done) opt.vibrate = [200,100,200]; else opt.silent = true;
  try{ await reg.showNotification(done ? "Rest done" : "Resting", opt); }catch(e){}
}

async function closeRestNote(){
  if(!canNotify()) return;
  const reg = await swReg();
  if(!reg || !reg.getNotifications) return;
  try{ (await reg.getNotifications({tag:REST_TAG})).forEach(n=>n.close()); }catch(e){}
}

/* ============================================================
   ACTIONS
   ============================================================ */
function openSession(s){
  state.view="session"; state.session=s; state.idx=0; sheet=null; shotOpen=null;
  finishPick = null;
  state.startedAt = Date.now();   // resuming restarts it — we time the sitting, not the calendar gap
  save(); keepAwake(); render();
  /* render() is sync; redraw once the photos are in the cache */
  loadImgs(s).then(render);
}
function home(){
  state.view="home"; state.session=null; sheet=null;
  state.pending=null; state.shareUrl=null; state.startedAt=null; finishPick=null;
  stopRest(); save(); render();
}
function plansView(){ state.view="plans"; sheet=null; state.shareUrl=null; save(); render(); }
/* named histView, not history — a top-level `function history()` would
   shadow the browser History object that clearHash() needs */
function histView(){ state.view="history"; sheet=null; state.calOff=0; state.selDay=null; save(); render(); }

function openSheet(n){
  const s=state.session, i=state.idx-1, ex=sess(s).ex[i];
  const cur = liveSets(s,i);
  const existing = cur[n-1];
  let w, r;
  if(existing){ w=existing.w; r=existing.r; }
  else {
    /* Set n opens on what set n was last time — the number to beat. It wins
       over today's earlier sets deliberately: the point is to see last
       session's figure every time, even after you've moved up today. */
    const p = prevSet(ex.name, n);
    if(p){ w=p.w; r=p.r; }
    /* last time had fewer sets than this — today's own last set is the
       better guess than anything in history */
    else if(cur.length){ w=cur[cur.length-1].w; r=cur[cur.length-1].r; }
    else { w=0; r=ex.lo; }
  }
  sheet = { set:n, w, r };
  render();
}

function logSet(){
  const s=state.session, i=state.idx-1, ex=sess(s).ex[i], k=lk(s,i);
  const arr = [...liveSets(s,i)];
  arr[sheet.set-1] = { w:sheet.w, r:sheet.r };
  for(let j=0;j<arr.length;j++) if(!arr[j]) arr[j] = { w:sheet.w, r:sheet.r };
  state.live[k]=arr;
  const done = arr.length, total = ex.sets;
  const logged = (sheet.w ? sheet.w+" "+state.units : "bodyweight") + " × " + sheet.r + " reps";
  sheet=null; save();
  startRest(ex.rest,
    done>=total ? "Last set logged. Move on when you're ready."
                : "Next: set "+(done+1)+" of "+total+" — "+ex.name,
    logged);
}

function clearSet(n){
  const s=state.session, i=state.idx-1, k=lk(s,i);
  const arr = liveSets(s,i).filter((_,j)=> j !== n-1);
  state.live[k]=arr; sheet=null; save(); render();
}

/* An abandoned session otherwise leaves the resume card on the home screen
   for good — there was no way to say "I'm not finishing that one". */
function discardSession(sid){
  const S = sess(sid);
  if(!S) return;
  if(!confirm("Discard the unsaved sets for "+S.name+"?\n\nWorkouts already saved to history aren't touched.")) return;
  S.ex.forEach((_,i)=>{ delete state.live[lk(sid,i)]; delete (state.feel||{})[feelKey(sid,i)]; });
  if(state.session === sid){ state.session = null; state.idx = 0; state.view = "home"; state.startedAt = null; finishPick = null; }
  sheet = null; clearRest(); save(); render();
}

function saveWorkout(){
  const s=state.session, S=sess(s);
  const entries={}, feel={};
  S.ex.forEach((e,i)=>{
    const v=liveSets(s,i); if(v.length) entries[e.name]=v;
    const f=liveFeel(s,i); if(f) feel[e.name]=f;
  });
  if(!Object.keys(entries).length){ home(); return; }
  const now = new Date().toISOString();
  /* Seconds for this sitting. A plausible span is just measured; a stale one
     uses the finish time the save page asked for. Records saved before any of
     this existed have no `dur` at all, so readers must treat it as optional. */
  const el = openSecs();
  const dur = !state.startedAt ? null
            : el > SESSION_MAX ? pickedDur(finishValue())
            : el > 0           ? el
            : null;
  state.log.push({
    id: T.today()+"-"+s+"-"+now.slice(11,19).replace(/:/g,""),
    date: now,
    day: T.today(),         // calendar date where the user was standing
    zone: T.zone(),         // IANA zone, so it stays right if they travel
    session:s, name:S.name,
    planId: state.planId,
    kind: S.kind,           // carried, because the plan can be deleted later
                            // and history still has to render
    ...(dur !== null ? { dur } : {}),
    ...(Object.keys(feel).length ? { feel } : {}),
    entries
  });
  S.ex.forEach((_,i)=>{ delete state.live[lk(s,i)]; delete state.feel[feelKey(s,i)]; });
  clearRest();
  state.startedAt = null; finishPick = null;
  state.view="home"; state.session=null; save(); render();
}

/* The day after the last one you logged on this plan, wrapping round. Falls
   back to the first day when there's nothing logged yet. */
function nextSession(){
  const o = order();
  if(!o.length) return null;
  for(let i=state.log.length-1; i>=0; i--){
    const r = state.log[i];
    if(r.planId !== state.planId) continue;
    const at = o.indexOf(r.session);
    if(at >= 0) return o[(at+1) % o.length];
  }
  return o[0];
}

function go(d){
  const max = sess(state.session).ex.length + 2;
  state.idx = Math.max(0, Math.min(max, state.idx+d));
  sheet=null; save(); window.scrollTo(0,0); render();
}

function wipe(){
  if(!confirm("Delete all workout history and in-progress sets? This can't be undone.")) return;
  state = { view:"home", session:null, idx:0, units:state.units, live:{}, log:[] };
  save(); render();
}

/* ============================================================
   RENDER
   ============================================================ */
const esc = t => String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
/* esc() alone is not enough inside an attribute — it leaves quotes intact, so
   an exercise named  5" curl  would break out of value="...". */
const escA = t => esc(t).replace(/"/g,"&quot;").replace(/'/g,"&#39;");

function render(){
  const app = document.getElementById("app");
  if(state.rest){ if(timer.id===null) runRest(); app.innerHTML = viewRest(); wire(); return; }
  app.innerHTML = state.view==="history" ? viewHistory()
                : state.view==="session" ? viewSession()
                : state.view==="plans"   ? viewPlans()
                : state.view==="editor"  ? viewEditor()
                : state.view==="import"  ? viewImport()
                : viewHome();
  wire();
}

function viewHome(){
  const P = plan();
  const inProg = order().find(s => { const p=sessionProgress(s); return p.got>0 && p.got<p.total; });
  let resume="";
  if(inProg){
    const p=sessionProgress(inProg);
    /* the discard sits outside the resume card — a button can't nest in a button */
    resume = `<div class="resume-wrap">
      <button class="resume" data-open="${escA(inProg)}">
        <div class="eyebrow">Pick up where you left off</div>
        <div class="resume-name">${esc(sess(inProg).name)}</div>
        <div class="resume-meta">${p.got} of ${p.total} sets logged</div></button>
      <button class="resume-drop" data-drop="${escA(inProg)}">Discard those sets</button>
    </div>`;
  }
  /* only suggest a day when nothing is half-finished */
  const upNext = inProg ? null : nextSession();

  const cards = order().map(s=>{
    const S = sess(s);
    if(!S) return "";
    const p=sessionProgress(s);
    const prev = state.log.filter(x=>x.session===s && x.planId===state.planId).pop();
    return `<button class="day ${s===upNext?"up":""}" data-open="${escA(s)}">
      <div>
        ${s===upNext ? `<span class="up-next">Up next</span>` : ""}
        <div class="day-name">${esc(S.name).replace(" ","<br>")}</div>
        <div class="day-meta">${prev ? "Last: "+T.fmtDay(recDay(prev)) : "Not logged yet"}</div>
      </div>
      <div class="day-bar"><i style="width:${Math.round(p.pct*100)}%"></i></div></button>`;
  }).join("");

  const n = state.log.length;
  const today = T.today();
  const week = state.log.filter(x => T.daysBetween(recDay(x), today) < 7).length;

  const sub = isBuiltin()
    ? "Mon Upper A · Tue Lower A · Thu Upper B · Fri Lower B"
    : P.order.length+" session"+(P.order.length>1?"s":"")+" · "+exCount(P)+" exercises";

  return `<div class="wrap">
    <div class="home-head">
      <div class="eyebrow">${isBuiltin() ? "Recommended · 30 min" : "Your plan"}</div>
      <h1 class="display">${esc(P.name)}</h1>
      <div class="home-sub">${esc(sub)}</div>
      ${n ? `<div class="streak">${n} workout${n>1?"s":""} logged · ${week} this week</div>` : ""}
    </div>
    ${resume}
    <div class="grid">${cards}</div>
    <div class="note"><b>Stop every set with 2–3 reps left in the tank.</b> If you could have done 3 more
      with good form, that's the right place to stop.</div>
    <button class="ghost" id="plans">Plans — switch, create or share</button>
    <button class="ghost" id="hist">View history (${n})</button>
    ${canNotify() ? `<button class="ghost" id="notify">Rest alerts: ${state.notify?"On":"Off"} — tap to switch</button>` : ""}
    <button class="ghost" id="units">Units: ${state.units.toUpperCase()} — tap to switch</button>
  </div>`;
}

/* ============================================================
   PLAN VIEWS
   ============================================================ */
function planChrome(title, inner, backId){
  return `<div class="topbar"><div class="topbar-row">
      <button class="back" id="${backId||"back2"}">← Back</button><div class="counter">${esc(title)}</div>
    </div><div class="steps"></div></div>
    <div class="wrap">${inner}</div>`;
}

function viewPlans(){
  const cards = allPlans().map(p=>{
    const on  = p.id === state.planId;
    const own = p.id !== "builtin";
    const acts = [
      on ? "" : `<button class="pbtn go" data-use="${escA(p.id)}">Use</button>`,
      `<button class="pbtn" data-share="${escA(p.id)}">Share</button>`,
      own ? `<button class="pbtn" data-edit="${escA(p.id)}">Edit</button>` : "",
      `<button class="pbtn" data-dup="${escA(p.id)}">Duplicate</button>`,
