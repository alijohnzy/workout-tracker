/* Per-exercise progression, aggregated by exercise NAME across every plan —
   the same reason lastTime() matches on name: renaming a lift starts a fresh
   line, moving it between plans doesn't. Entries can arrive from an imported
   file, so nothing in here trusts its shape. */
function exerciseStats(recs){
  const map = {};
  (recs || state.log).forEach(rec=>{
    const entries = rec && rec.entries;
    if(!entries || typeof entries !== "object") return;
    Object.keys(entries).forEach(name=>{
      const raw = entries[name];
      if(!Array.isArray(raw) || !raw.length) return;
      const sets = raw.filter(s => s && typeof s === "object")
                      .map(s => ({ w: Number(s.w) || 0, r: Number(s.r) || 0 }));
      if(!sets.length) return;
      const better = (a,b) => a.w > b.w || (a.w === b.w && a.r > b.r);
      const top = sets.reduce((t,s)=> better(s,t) ? s : t, sets[0]);
      const m = map[name] || (map[name] = { name, sessions:[] });
      m.sessions.push({ day: recDay(rec), sets, top });
    });
  });

  return Object.keys(map).map(k=>{
    const m = map[k];
    m.sessions.sort((a,b)=> a.day < b.day ? -1 : a.day > b.day ? 1 : 0);
    const all = m.sessions.reduce((a,s)=> a.concat(s.sets), []);
    m.count  = m.sessions.length;
    m.setsN  = all.length;
    m.avgW   = all.reduce((t,s)=> t+s.w, 0) / all.length;
    m.avgR   = all.reduce((t,s)=> t+s.r, 0) / all.length;
    m.best   = all.reduce((b,s)=> (s.w > b.w || (s.w === b.w && s.r > b.r)) ? s : b, all[0]);
    m.first  = m.sessions[0].top;
    m.latest = m.sessions[m.count-1].top;
    m.lastDay = m.sessions[m.count-1].day;
    /* bodyweight movements have nothing to plot on the weight axis, so they
       track reps instead */
    m.byW = m.sessions.some(s => s.top.w > 0);
    return m;
  }).sort((a,b)=> a.lastDay < b.lastDay ? 1 : a.lastDay > b.lastDay ? -1 : 0);
}

/* the per-exercise cards for one bucket of records */
function progCards(recs){
  const stats = exerciseStats(recs);
  if(!stats.length) return `<div class="empty">Nothing logged here yet.</div>`;

  return stats.map(m=>{
    const val  = t => m.byW ? t.w : t.r;
    const unit = m.byW ? state.units : "reps";
    const series = m.sessions.slice(-12);
    const vals = series.map(s=>val(s.top));
    const max = Math.max(...vals), min = Math.min(...vals), span = max - min;
    /* indexed to the range, not to zero — working weights cluster near the
       top, so a real 40 -> 50 climb would otherwise render as a flat wall.
       The first/latest/best figures underneath carry the absolute truth. */
    const bars = vals.map(v=>
      `<i style="height:${span ? 30 + Math.round((v-min)/span*70) : 100}%"></i>`).join("");

    const d = val(m.latest) - val(m.first);
    const pct = val(m.first) ? Math.round(d / val(m.first) * 100) : null;
    const trend = m.count < 2
      ? `<span class="tr flat">first session</span>`
      : `<span class="tr ${d>0?"up":d<0?"down":"flat"}">${d>0?"▲ +":d<0?"▼ ":"– "}${round1(Math.abs(d))} ${esc(unit)}${
          pct !== null && d !== 0 ? " · "+(d>0?"+":"−")+Math.abs(pct)+"%" : ""}</span>`;

    return `<div class="prog">
      <div class="prog-top"><div class="prog-name">${feelTag(lastFeel(m.name))}${esc(m.name)}</div>${trend}</div>
      <div class="prog-bars">${bars}</div>
      <div class="prog-grid">
        <div><b>${round1(val(m.first))}</b><span>first</span></div>
        <div><b>${round1(val(m.latest))}</b><span>latest</span></div>
        <div><b>${esc(setLabel(m.best))}</b><span>best set</span></div>
      </div>
      <div class="prog-avg">${m.count} session${m.count>1?"s":""} · ${m.setsN} sets ·
        avg ${m.byW ? round1(m.avgW)+" "+esc(state.units)+" × " : ""}${round1(m.avgR)} reps</div>
    </div>`;
  }).join("");
}

/* History grouped the way you actually think about it: plan, then the day
   inside it. Buckets come from the RECORDS (planId + session), not from the
   current plans, so days from a plan you've since deleted still show up. */
function progGroups(){
  const plans = new Map();
  state.log.forEach(r=>{
    if(!r || !r.entries || typeof r.entries !== "object") return;
    const pid = r.planId || "builtin", sid = r.session || "?";
    if(!plans.has(pid)) plans.set(pid, { id:pid, days:new Map(), n:0, last:"" });
    const P = plans.get(pid);
    if(!P.days.has(sid)) P.days.set(sid, { id:sid, name:r.name || sid, recs:[], last:"" });
    const D = P.days.get(sid);
    D.recs.push(r);
    if(r.name) D.name = r.name;
    const day = recDay(r);
    if(day > D.last) D.last = day;
    if(day > P.last) P.last = day;
    P.n++;
  });
  return [...plans.values()]
    .sort((a,b)=> a.last < b.last ? 1 : a.last > b.last ? -1 : 0)
    .map(P=>{
      const live = planById(P.id);
      return { ...P, name: live ? live.name : "Deleted plan", gone: !live,
               days: [...P.days.values()].sort((a,b)=> a.last < b.last ? 1 : a.last > b.last ? -1 : 0) };
    });
}

function progList(){
  const groups = progGroups();
  if(!groups.length) return `<div class="empty">Nothing to compare yet.</div>` + dataPanel();

  /* the active plan opens, its days stay shut — the whole point is that this
     used to be one very long list */
  const html = groups.map(P=>`
    <details class="pgroup" ${P.id===state.planId?"open":""}>
      <summary class="pgroup-head">
        <span class="pgroup-name">${esc(P.name)}${P.gone?` <span class="pgone">deleted</span>`:""}</span>
        <span class="pgroup-n">${P.n} session${P.n>1?"s":""}</span>
      </summary>
      <div class="pgroup-body">
        ${P.days.map(D=>`
          <details class="pday">
            <summary class="pday-head">
              <span class="pday-name">${esc(D.name)}</span>
              <span class="pgroup-n">${D.recs.length}× · ${T.fmtDay(D.last)}</span>
            </summary>
            <div class="pday-body">${progCards(D.recs)}</div>
          </details>`).join("")}
      </div>
    </details>`).join("");

  return html + dataPanel();
}

function histCal(){
  const off = state.calOff || 0;
  const nowP = T.parts(T.today());
  const base = new Date(nowP.y, nowP.m-1+off, 1);
  const y=base.getFullYear(), m=base.getMonth();
  const firstDow = new Date(y,m,1).getDay();
  const nDays = new Date(y,m+1,0).getDate();
  const byDay = logsByDay();
  const todayK = T.today();

  let cells = Array.from({length:firstDow},()=>`<div class="cell pad">0</div>`).join("");
  for(let d=1; d<=nDays; d++){
    const k = y+"-"+pad(m+1)+"-"+pad(d);
    const recs = byDay[k];
    let cls="cell";
    if(recs){
      const kinds = new Set(recs.map(recKind));
      const up = kinds.has("upper"), lo = kinds.has("lower");
      cls += " hit " + (up && lo ? "both" : up ? "upper" : lo ? "lower" : "full");
    }
    if(k===todayK) cls+=" today";
    if(state.selDay===k) cls+=" sel";
    cells += `<button class="${cls}" ${recs?`data-day="${k}"`:""}>${d}</button>`;
  }

  const monthLogs = state.log.filter(r=>{ const p=T.parts(recDay(r)); return p.y===y && p.m===m+1; });
  const gap = avgGap();

  let detail="";
  if(state.selDay && byDay[state.selDay]){
    detail = byDay[state.selDay].map(rec=>{
      const rows = Object.entries(rec.entries).map(([n,sets])=>
        `<div class="srow"><span class="nm">${feelTag(rec.feel && rec.feel[n])}${esc(n)}</span>
          <span class="vv">${esc(setStr(sets))}</span></div>`).join("");
      return `<div class="daycard"><h4>${esc(rec.name)} · ${T.fmtDay(recDay(rec))}${
        rec.dur ? " · "+fmtDur(rec.dur) : ""}</h4>${rows}</div>`;
    }).join("");
  }

  const monthName = base.toLocaleDateString(undefined,{month:"long",year:"numeric"});

  return `<div class="mo">
      <div class="mo-name">${monthName}</div>
      <div class="mo-nav">
        <button id="moPrev">‹</button>
        <button id="moNext" ${off>=0?"disabled":""}>›</button>
      </div>
    </div>
    <div class="dow"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
    <div class="cal">${cells}</div>
    <div class="legend">
      <span><i style="background:var(--blue)"></i>Upper</span>
      <span><i style="background:var(--gold)"></i>Lower</span>
    </div>
    <div class="stat">
      <b>${monthLogs.length}</b> workout${monthLogs.length===1?"":"s"} this month
      ${gap ? ` · <b>${gap}</b> day average gap` : ""}
    </div>
    ${detail}
    ${state.selDay?"":`<div class="ics-note">Tap a marked day to see what you lifted.</div>`}
    ${dataPanel()}`;
}

function viewSession(){
  const s=state.session, S=sess(s);
  /* the plan can be deleted from another tab while a session is open */
  if(!S){ state.view="home"; state.session=null; return viewHome(); }
  /* 0 warm-up · 1..n exercises · n+1 cool-down · n+2 save */
  const list=S.ex, cool=list.length+1, last=list.length+2;

  const steps = ["w",...list.map((_,i)=>i),"c"].map((v,pos)=>{
    let c="";
    if(pos===state.idx) c="now";
    else if(pos===0) c="done";
    else if(pos===cool) c = state.idx>cool ? "done" : "";
    else if(liveSets(s,pos-1).length >= list[pos-1].sets) c="done";
    return `<i class="${c}"></i>`;
  }).join("");

  let body, nav;

  if(state.idx===0){
    body = `<h2 class="ex-name">Warm-Up</h2><div class="ex-alt">About 5 minutes</div>
      <details class="form" open><summary>What to do</summary><div class="form-body">
        <ul class="wu">${warmupFor(S).map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div></details>`;
    nav = `<button class="prev" id="back">Exit</button><button class="next ready" id="next">Start lifting →</button>`;

  } else if(state.idx===cool){
    body = `<h2 class="ex-name">Cool-Down</h2><div class="ex-alt">About 5 minutes</div>
      <details class="form" open><summary>What to do</summary><div class="form-body">
        <ul class="wu">${cooldownFor(S).map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div></details>`;
    nav = `<button class="prev" id="prev">← Back</button>
           <button class="next ready" id="next">Finish →</button>`;

  } else if(state.idx===last){
    const entries=[];
    list.forEach((e,i)=>{ const v=liveSets(s,i); if(v.length) entries.push([e.name,v]); });
    const rows = entries.length
      ? entries.map(([n,v])=>`<div class="srow"><span class="nm">${esc(n)}</span><span class="vv">${esc(setStr(v))}</span></div>`).join("")
      : `<div class="srow"><span class="nm" style="color:var(--muted)">No sets logged</span></div>`;
    const obj={}; entries.forEach(([n,v])=>obj[n]=v);
    body = `<div class="done-screen">
        <div class="done-mark">✓</div>
        <h2 class="display">${esc(S.name)} done</h2>
        <div class="done-sub">${entries.length ? volume(obj).toLocaleString()+" "+state.units+" total volume" : "Nothing logged"}</div>
      </div>
      <div class="summary">${rows}</div>
      ${isStale() ? `<div class="finish">
        <div class="eyebrow">Left open since ${esc(hhmm(state.startedAt))} on ${esc(T.fmtDay(T.dayOf(new Date(state.startedAt).toISOString())))}</div>
        <div class="finish-row">
          <span class="finish-lab">Finished at</span>
          <input type="time" id="finTime" value="${escA(finishValue())}">
        </div>
        <div class="finish-note" id="finNote">${esc(finishNote())}</div>
      </div>` : ""}
      <button class="save-btn" id="saveW">Save workout to history</button>`;
    nav = `<button class="prev" id="prev">← Back</button><button class="next" id="back">Exit without saving</button>`;

  } else {
    const i=state.idx-1, ex=list[i], arr=liveSets(s,i), allDone=arr.length>=ex.sets;
    const prev = lastTime(ex.name);

    const setBtns = Array.from({length:ex.sets},(_,n)=>{
      const v = arr[n];
      const open = sheet && sheet.set===n+1;
      /* an unlogged set advertises what it was last time, so you can see the
         target without opening the sheet */
      const p = v ? null : prevSet(ex.name, n+1);
      return `<button class="set ${v?"done":""} ${open?"active":""}" data-set="${n+1}">
        <span class="n">${v ? setLabel(v) : (n+1)}</span>
        <span class="l">${v ? "set "+(n+1) : (p ? "last "+setLabel(p) : "set "+(n+1))}</span></button>`;
    }).join("");

    const a=linkFor(ex.name, ex.vid);
    let vids = `<a class="vid ${a.vetted?"vetted":""}" href="${a.url}" target="_blank" rel="noopener">
        <span class="play">▶</span><span>${a.label}</span>${a.vetted?"":`<span class="tag">search</span>`}</a>`;
    if(ex.altVid){
      const b=linkFor(ex.altVid);
      vids += `<a class="vid ${b.vetted?"vetted":""}" href="${b.url}" target="_blank" rel="noopener">
        <span class="play">▶</span><span>${esc(ex.altVid)}</span>${b.vetted?"":`<span class="tag">search</span>`}</a>`;
    }
    /* images beat video in a gym — no ads, no buffering, readable at a glance */
    vids += `<a class="vid pic" href="${escA(imgSearch(ex.name))}" target="_blank" rel="noopener">
        <span class="play">▤</span><span>Find an image</span></a>`;

    const shot = IMG[ex.name];
    const photo = shot
      ? `<div class="shots">
           <button class="shot ${shotOpen===ex.name?"big":""}" data-shot="${escA(ex.name)}"><img src="${escA(shot)}" alt=""></button>
           ${shotOpen===ex.name ? `<div class="shot-acts">
              <button class="shot-act" data-rephoto="${escA(ex.name)}">Replace</button>
              <button class="shot-act drop" data-unshot="${escA(ex.name)}">Remove</button></div>` : ""}
         </div>`
      : `<button class="ghost addshot" data-rephoto="${escA(ex.name)}">+ Save a form photo for next time</button>`;

    const sheetHTML = sheet ? `<div class="sheet">
        <div class="sheet-head">
          <span class="sheet-title">Set ${sheet.set} of ${ex.sets}</span>
          <button class="sheet-close" id="closeSheet">${arr[sheet.set-1] ? "Clear set" : "Cancel"}</button>
        </div>
        <div class="fields">
          <div class="field"><span class="eyebrow">Weight (${state.units})</span>
            <div class="stepper"><button data-adj="w:-1">−</button>
              <input type="number" inputmode="decimal" id="wIn" value="${sheet.w}">
              <button data-adj="w:1">+</button></div></div>
          <div class="field"><span class="eyebrow">Reps</span>
            <div class="stepper"><button data-adj="r:-1">−</button>
              <input type="number" inputmode="numeric" id="rIn" value="${sheet.r}">
              <button data-adj="r:1">+</button></div></div>
        </div>
        <button class="log-btn" id="logSet">Log set ${sheet.set}</button>
        <div class="prefill">Target ${esc(ex.reps)} reps · set 0 weight for bodyweight</div>
      </div>` : "";

    body = `<h2 class="ex-name">${esc(ex.name)}</h2>
      ${ex.alt ? `<div class="ex-alt"><b>Or:</b> ${esc(ex.alt)}</div>` : ""}
      ${photo}
      <div class="target">
        <div class="chip"><div class="eyebrow">Sets</div><div class="chip-val">${ex.sets}</div></div>
        <div class="chip"><div class="eyebrow">Reps</div><div class="chip-val">${esc(ex.reps)}</div></div>
        <div class="chip"><div class="eyebrow">Rest</div><div class="chip-val">${ex.rest>=60?(ex.rest/60)+" min":ex.rest+"s"}</div></div>
      </div>
      ${prev ? `<div class="last"><div class="eyebrow">Last time · ${fmtDate(prev.date)}</div>
                 <div class="last-sets">${esc(setStr(prev.sets))}</div></div>`
             : `<div class="last-none">No history for this one yet — today sets your baseline.</div>`}
      <div class="vids">${vids}</div>
      <div class="sets">${setBtns}</div>
      ${sheetHTML}
      ${sheet ? "" : `<div class="hint">${allDone ? "All sets logged. Tap one to edit." : "Tap a set to log your weight and reps."}</div>`}
      <details class="form"><summary>Form check</summary><div class="form-body">
        <div class="check ok"><span class="mark">✓</span><span>${esc(ex.ok)}</span></div>
        <div class="check no"><span class="mark">✕</span><span>${esc(ex.no)}</span></div>
        <div class="cue"><b>Cue:</b> ${esc(ex.cue)}</div>
        ${ex.warn ? `<div class="warn">${esc(ex.warn)}</div>` : ""}
      </div></details>
      ${feelBlock(ex, i)}`;
    nav = `<button class="prev" id="prev">← Back</button>
           <button class="next ${allDone?"ready":""}" id="next">${state.idx===list.length?"Finish":"Next exercise →"}</button>`;
  }

  return `<div class="topbar"><div class="topbar-row">
      <button class="back" id="back2">← All days</button>
      <div class="counter">${state.idx===0?"WARM-UP":state.idx===cool?"COOL-DOWN":state.idx===last?"COMPLETE":state.idx+" / "+list.length}</div>
    </div><div class="steps">${steps}</div></div>
    <div class="wrap">${body}<div class="nav">${nav}</div></div>`;
}

/* Optional on purpose — nothing is preselected and tapping the chosen face
   again clears it, so skipping this costs nothing. */
function feelBlock(ex, i){
  const mine = liveFeel(state.session, i);
  const was  = lastFeel(ex.name);
  const wasF = feelOf(was);
  return `<div class="feel">
    <div class="feel-head">
      <span class="eyebrow">How did that feel?</span>
      ${wasF ? `<span class="feel-was">Last time <span class="feel-tag ${wasF.cls}">${faceSvg(wasF)}</span> ${esc(wasF.label)}</span>` : ""}
    </div>
    <div class="feel-row">${FEELS.map(f=>`
      <button class="feel-btn ${f.cls} ${mine===f.v?"on":""}" data-feel="${f.v}">
        ${faceSvg(f)}<span>${esc(f.label)}</span>
      </button>`).join("")}</div>
  </div>`;
}

function viewRest(){
  return `<div class="rest">
    <div class="rest-label">Rest</div>
    <div class="rest-time" id="restTime">${fmtT(restLeft())}</div>
    ${state.rest.logged ? `<div class="rest-logged">Logged ${esc(state.rest.logged)}</div>` : ""}
    <div class="rest-next">${esc(state.rest.note)}</div>
    <div class="rest-btns"><button class="add" id="add30">+30 sec</button>
      <button class="skip" id="skip">Done resting</button></div></div>`;
}

/* ============================================================
   EVENTS
   ============================================================ */
function wire(){
  const on=(id,fn)=>{ const el=document.getElementById(id); if(el) el.onclick=fn; };

  document.querySelectorAll("[data-open]").forEach(b=> b.onclick=()=>openSession(b.dataset.open));
  document.querySelectorAll("[data-drop]").forEach(b=> b.onclick=()=>discardSession(b.dataset.drop));
  document.querySelectorAll("[data-shot]").forEach(b=>
    b.onclick=()=>{ shotOpen = shotOpen===b.dataset.shot ? null : b.dataset.shot; render(); });
  document.querySelectorAll("[data-rephoto]").forEach(b=> b.onclick=()=>pickPhoto(b.dataset.rephoto));
  document.querySelectorAll("[data-unshot]").forEach(b=> b.onclick=()=>dropPhoto(b.dataset.unshot));
  document.querySelectorAll("[data-set]").forEach(b=> b.onclick=()=>openSheet(+b.dataset.set));
  document.querySelectorAll("[data-feel]").forEach(b=> b.onclick=()=>setFeel(state.idx-1, +b.dataset.feel));

  document.querySelectorAll("[data-adj]").forEach(b=> b.onclick=()=>{
    const [f,d]=b.dataset.adj.split(":");
    if(f==="w") sheet.w = wStep(sheet.w, parseInt(d));   // one rung, not a fixed delta
    else        sheet.r=Math.max(1, sheet.r + parseInt(d));
    render();
  });

  const wIn=document.getElementById("wIn"), rIn=document.getElementById("rIn");
  if(wIn) wIn.oninput=()=>{ sheet.w = Math.max(0, parseFloat(wIn.value)||0); };
  if(rIn) rIn.oninput=()=>{ sheet.r = Math.max(1, parseInt(rIn.value)||1); };

  on("logSet", logSet);
  on("closeSheet", ()=>{
    const arr = liveSets(state.session, state.idx-1);
    if(arr[sheet.set-1]) clearSet(sheet.set); else { sheet=null; render(); }
  });
  const finIn = document.getElementById("finTime");
  if(finIn) finIn.oninput = ()=>{
    finishPick = finIn.value;
    const note = document.getElementById("finNote");
    if(note) note.textContent = finishNote();
  };
  on("saveW", saveWorkout);
  on("tabCal",  ()=>{ state.tab="cal";  save(); render(); });
  on("tabList", ()=>{ state.tab="list"; state.selDay=null; save(); render(); });
  on("tabProg", ()=>{ state.tab="prog"; state.selDay=null; save(); render(); });
  on("moPrev",  ()=>{ state.calOff=(state.calOff||0)-1; state.selDay=null; save(); render(); });
  on("moNext",  ()=>{ state.calOff=Math.min(0,(state.calOff||0)+1); state.selDay=null; save(); render(); });
  on("ics", exportICS);
  on("expJson", exportJSON);
  on("impJson", pickImport);
  document.querySelectorAll("[data-day]").forEach(b=>
    b.onclick=()=>{ state.selDay = state.selDay===b.dataset.day ? null : b.dataset.day; save(); render(); });
  /* ---- plans ---- */
  document.querySelectorAll("[data-use]").forEach(b=>   b.onclick=()=>usePlan(b.dataset.use));
  document.querySelectorAll("[data-share]").forEach(b=> b.onclick=()=>sharePlan(b.dataset.share));
  document.querySelectorAll("[data-edit]").forEach(b=>  b.onclick=()=>editPlan(b.dataset.edit));
  document.querySelectorAll("[data-dup]").forEach(b=>   b.onclick=()=>dupPlan(b.dataset.dup));
  document.querySelectorAll("[data-del]").forEach(b=>   b.onclick=()=>delPlan(b.dataset.del));
  on("plans", plansView);
  on("newPlan", newPlan);
  on("impLink", pasteLink);
  on("impYes", acceptShared);
  on("impNo", rejectShared);

  /* ---- editor ---- */
  document.querySelectorAll("[data-tab]").forEach(b=>
    b.onclick=()=>{ state.draft.tab=b.dataset.tab; save(); window.scrollTo(0,0); render(); });
  document.querySelectorAll("[data-up]").forEach(b=>   b.onclick=()=>edMoveEx(+b.dataset.up,-1));
  document.querySelectorAll("[data-down]").forEach(b=> b.onclick=()=>edMoveEx(+b.dataset.down,1));
  document.querySelectorAll("[data-rm]").forEach(b=>   b.onclick=()=>edDelEx(+b.dataset.rm));
  document.querySelectorAll("[data-ed]").forEach(b=> b.onclick=()=>{
    const [f,dv,i] = b.dataset.ed.split(":");
    const e = state.draft.sessions[state.draft.tab].ex[+i];
    const [lo,hi] = f==="sets" ? [1,20] : [0,600];
    e[f] = Math.min(hi, Math.max(lo, (parseInt(e[f])||0) + parseInt(dv)));
    save(); render();
  });

  /* Field edits deliberately do NOT render — replacing #app mid-word would
     drop the caret. The draft is updated in place and saved on a debounce. */
  document.querySelectorAll("[data-fld]").forEach(el=> el.oninput=()=>{
    const d = state.draft;
    if(!d) return;
    const f = el.dataset.fld;
    if(f==="name")       d.name = el.value;
    else if(f==="sname") d.sessions[d.tab].name = el.value;
    else if(f==="skind") d.sessions[d.tab].kind = el.value;
    else if(f==="swarm") d.sessions[d.tab].warmup = el.value;
    else if(f==="scool") d.sessions[d.tab].cooldown = el.value;
    else if(f==="ex"){
      const e = d.sessions[d.tab].ex[+el.dataset.i], k = el.dataset.k;
      e[k] = (k==="sets"||k==="rest"||k==="lo") ? (parseInt(el.value)||0) : el.value;
    }
    saveSoon();
  });
  on("addEx", edAddEx);
  on("addSession", edAddSession);
  on("delSession", edDelSession);
  on("edSave", saveDraft);
  on("edCancel", cancelDraft);

  on("next", ()=>go(1));
  on("prev", ()=>go(-1));
  on("back", home);
  on("back2", home);
  on("hist", histView);
  on("wipe", wipe);
  on("notify", toggleNotify);
  on("units", ()=>{ state.units = state.units==="lb" ? "kg" : "lb"; save(); render(); });
  on("skip", stopRest);
  on("add30", ()=>{ state.rest.endsAt += 30000; state.rest.buzzed=false; save(); paintRest(); showRestNote(false); });
}

/* Offline caching, only where the platform allows it. On file:// or content://
   this is a no-op — the page already works offline because everything is inlined. */
if((location.protocol==="https:" || location.hostname==="localhost") && navigator.serviceWorker){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}

/* a shared link can also arrive while the app is already open (installed PWAs
   get handed the URL without a reload) */
window.addEventListener("hashchange", async ()=>{
  if(await checkShareLink()){ save(); render(); }
});

(async function(){
  await load();
  if(await checkShareLink()) save();
  if(state.session) keepAwake();
  render();
})();
</script>
